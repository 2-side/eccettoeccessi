<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="nofollow, noindex">
  
    <style>

      :root {
        --main-color:linear-gradient(0.25turn, #305e72, #1f7b80, #30145c);
        --font:  "Gill Sans Extrabold", sans-serif;
      }
      [theme=dark]
     body {
        color-scheme: light dark; /* Enabling light mode and dark mode */
        color: light-dark(#333, #fff); /* Text light and dark colors */
        background-color: light-dark(#fff, #222); /* Background light and dark colors*/
        display:flex;
        flex-wrap:wrap;
        padding: 30px;
        gap: 20px;
        align-items:center;
        justify-content:space-between;
        /* background-image: var(--main-color); */
        font-family: var(--font);
      }
      .container {
        display:flex;
        flex-direction:column;
        gap: 20px;
        align-items:center;
        justify-content:space-between;
      }
  
      .card {
        display:flex;
        flex-direction:column;
        background-color: #000000;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>Un po' di tutto...</p>  
      <h1>Eccetto eccessi</h1>
    </div>
    <div>
      <div class="card">
        <h2>Distributori artificiali</h2>
      </div>
    </div>
  </body>
</html>
